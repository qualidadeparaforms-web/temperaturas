{% extends "base.html" %}
{% block titulo %}Início — Registros{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8">
    <h2 class="titulo-secao text-center mb-4">O que você quer registrar?</h2>
    <div class="row row-cols-1 row-cols-md-2 g-3">
      {% for tipo in tipos %}
      <div class="col">
        <a href="{{ url_for(tipo.slug + '.index') }}" class="btn-tipo w-100">
          <span class="btn-tipo-icone">{{ tipo.icone }}</span>
          <span class="btn-tipo-nome">{{ tipo.nome }}</span>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
