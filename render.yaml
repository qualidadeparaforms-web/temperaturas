# Blueprint de deploy para o Render (https://render.com).
# Em "New +" > "Blueprint", aponte para este repositório e o Render
# lerá este arquivo automaticamente.
#
# Configuração atual: plano FREE, sem cartão de crédito e sem disco
# pago — ideal para testar o protótipo antes de decidir investir.
#
# Limitações do plano Free (aceitáveis para um teste):
# - O serviço "dorme" após 15 min sem acesso e demora ~1 min para
#   acordar no próximo acesso.
# - Não tem disco persistente: a cada novo deploy o banco de dados
#   local começa vazio (os registros anteriores são perdidos, a menos
#   que você configure a Opção B comentada no final deste arquivo).
#
# Quando for para uso real na fábrica, troque para a Opção A
# (comentada abaixo) — Disk persistente, sem esse risco, ~US$7,25/mês.
services:
  - type: web
    name: temperaturas-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BACKUP_TOKEN
        generateValue: true

# ---------------------------------------------------------------------
# OPÇÃO A — DISCO PERSISTENTE (recomendado para uso real, plano pago):
# troque "plan: free" por "plan: starter" no serviço acima, adicione
# aos envVars:
#
#       - key: DATABASE_PATH
#         value: /var/data/temperaturas.db
#       - key: BACKUP_DIR
#         value: /var/data/backups
#
# e adicione ao serviço (mesmo nível de "envVars"):
#
#     disk:
#       name: dados
#       mountPath: /var/data
#       sizeGB: 1
#
# Sem janela de perda de dados entre deploys. Custo aproximado:
# US$7/mês (plano Starter) + US$0,25/mês (1GB de disco).
# ---------------------------------------------------------------------
# OPÇÃO B — GRATUITO, COM BACKUP/RESTAURAÇÃO AUTOMÁTICA NO S3:
# mantendo "plan: free" acima, adicione aos envVars (veja o passo a
# passo completo com Cloudflare R2 no README.md):
#
#       - key: BACKUP_S3_BUCKET
#         value: seu-bucket-aqui
#       - key: BACKUP_S3_ENDPOINT_URL   # só p/ compatíveis (R2, B2); remova se for AWS S3 de fato
#         value: https://<account_id>.r2.cloudflarestorage.com
#       - key: AWS_ACCESS_KEY_ID
#         sync: false
#       - key: AWS_SECRET_ACCESS_KEY
#         sync: false
#
# A aplicação faz backup a cada registro salvo (não só periodicamente
# — necessário porque o plano Free apaga o disco a cada vez que
# "dorme" por inatividade, não só em redeploys) para o S3 ou
# compatível (Cloudflare R2, Backblaze B2 — ambos com camada
# gratuita), e restaura automaticamente o backup mais recente sempre
# que subir num disco vazio. boto3 já vem no requirements.txt.
# ---------------------------------------------------------------------
